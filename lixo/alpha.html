<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Card Roguelike</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #1c1c1c, #111);
      color: #fff;
      margin: 0;
      padding: 1em;
      text-align: center;
    }
    h1 {
      color: #0ff;
      margin-bottom: 0.5em;
    }
    #hud {
      font-size: 1.1em;
      margin-bottom: 1em;
    }
    #map, #cards, #enemies {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    .card, .node, .enemy {
      padding: 10px;
      border-radius: 12px;
      min-width: 100px;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      position: relative;
    }
    .card:active, .enemy:active, .node:active {
      transform: scale(0.95);
    }
    .card.common { background: #444; border: 2px solid #888; }
    .card.rare { background: #0055aa; border: 2px solid #00aaff; }
    .card.epic { background: #550077; border: 2px solid #aa00ff; }
    .enemy { background: #800; border: 2px solid #f00; color: #fff; }
    .node { background: #222; border: 2px solid #666; }
    .node.active { border-color: #0f0; background: #030; }
    .node.visited { border-color: #0ff; }
    #log {
      min-height: 2em;
      margin-top: 10px;
      font-style: italic;
    }
    .floating {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-weight: bold;
      pointer-events: none;
      animation: floatUp 1s ease-out forwards;
    }
    @keyframes floatUp {
      from { bottom: 0; opacity: 1; }
      to { bottom: 60px; opacity: 0; }
    }
    .shake {
      animation: shake 0.3s;
    }
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }
    .fade-in {
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    button {
      padding: 0.5em 1em;
      background: #333;
      border: 2px solid #888;
      color: #fff;
      cursor: pointer;
      border-radius: 8px;
      margin: 10px;
    }
    button:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <h1>Roguelike de Cartas</h1>
  <div id="hud">HP: <span id="player-hp">20</span> | Energia: <span id="energy">5</span></div>
  <div id="map"></div>
  <h2>Inimigos</h2>
  <div id="enemies"></div>
  <h2>Cartas</h2>
  <div id="cards"></div>
  <p id="log"></p>
  <button id="end-turn">Pular Turno</button>

  <script>
    let playerHP = 20, energy = 5, currentNode = 0;
    const mapNodes = Array.from({ length: 5 }, (_, i) => ({ id: i }));
    let enemies = [];
    let deck = [];

    const allCards = [
      { name: "Ataque", cost: 1, rarity: "common", basePower: 4 },
      { name: "Defesa", cost: 1, rarity: "rare", basePower: 3 },
      { name: "Cura", cost: 2, rarity: "epic", basePower: 6 },
      { name: "Explosão", cost: 3, rarity: "epic", basePower: 5, isAoE: true },
      { name: "Escudo", cost: 2, rarity: "rare", basePower: 5, isDefensive: true },
      { name: "Golpe Duplo", cost: 2, rarity: "common", basePower: 3, isDoubleAttack: true }
    ];

    const enemyTemplates = [
      {
        name: "Goblin", hp: 10, behavior: () => {
          return [{ type: 'attack', value: rand(1, 2) }];
        }
      },
      {
        name: "Orc", hp: 16, behavior: () => {
          return [{ type: 'attack', value: rand(4, 6) }];
        }
      },
      {
        name: "Slime", hp: 12, behavior: () => {
          return Math.random() < 0.3 ? [{ type: 'heal', value: 4 }] : [{ type: 'attack', value: rand(2, 3) }];
        }
      }
    ];

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateDeck() {
      deck = [];
      for (let i = 0; i < 5; i++) {
        const base = { ...allCards[Math.floor(Math.random() * allCards.length)] };
        const bonus = base.rarity === 'rare' ? 1 : base.rarity === 'epic' ? 2 : 0;
        deck.push({ ...base, power: base.basePower + bonus });
      }
    }

    function spawnEnemies() {
      enemies = [];
      for (let i = 0; i < rand(1, 2); i++) {
        const e = { ...enemyTemplates[Math.floor(Math.random() * enemyTemplates.length)] };
        enemies.push(e);
      }
    }

    function drawMap() {
      const map = document.getElementById("map");
      map.innerHTML = "";
      mapNodes.forEach((node, i) => {
        const div = document.createElement("div");
        div.className = "node" + (i === currentNode ? " active" : i < currentNode ? " visited" : "");
        div.textContent = "Sala " + (i + 1);
        div.onclick = () => {
          if (i === currentNode + 1 && enemies.length === 0) {
            currentNode = i;
            enterRoom();
          } else if (i <= currentNode) {
            log("Você já esteve aqui.");
          } else {
            log("Derrote os inimigos antes!");
          }
        };
        map.appendChild(div);
      });
    }

    function drawCards() {
      const cards = document.getElementById("cards");
      cards.innerHTML = "";
      deck.forEach((card, i) => {
        const div = document.createElement("div");
        div.className = `card ${card.rarity} fade-in`;
        div.textContent = `${card.name} (${card.cost} Energia)`;
        div.onclick = () => {
          if (energy < card.cost || playerHP <= 0 || enemies.length === 0) return;
          energy -= card.cost;
          if (card.name === "Ataque") {
            enemies[0].hp -= card.power;
            floatText(enemies[0].el, `-${card.power}`, "red");
            enemies[0].el.classList.add("shake");
            log("Usou Ataque!");
          } else if (card.name === "Defesa") {
            playerHP += card.power;
            floatText(document.body, `+${card.power}`, "lime");
            log("Usou Defesa!");
          } else if (card.name === "Cura") {
            playerHP += card.power;
            floatText(document.body, `+${card.power}`, "aqua");
            log("Usou Cura!");
          } else if (card.name === "Explosão") {
            enemies.forEach(e => {
              e.hp -= card.power;
              floatText(e.el, `-${card.power}`, "red");
            });
            log("Usou Explosão!");
          } else if (card.name === "Escudo") {
            playerHP += card.power;
            floatText(document.body, `+${card.power}`, "blue");
            log("Usou Escudo!");
          } else if (card.name === "Golpe Duplo") {
            enemies[0].hp -= card.power * 2;
            floatText(enemies[0].el, `-${card.power * 2}`, "red");
            enemies[0].el.classList.add("shake");
            log("Usou Golpe Duplo!");
          }
          deck.splice(i, 1); // Remove a carta da mão
          updateHUD();
          checkEnemies();
          if (energy === 0) enemyTurn();
        };
        cards.appendChild(div);
      });
    }

    function drawEnemies() {
      const area = document.getElementById("enemies");
      area.innerHTML = "";
      enemies.forEach(e => {
        const div = document.createElement("div");
        div.className = "enemy fade-in";
        div.textContent = `${e.name} - ${e.hp} HP`;
        e.el = div;
        area.appendChild(div);
      });
    }

    function enemyTurn() {
      setTimeout(() => {
        enemies.forEach(e => {
          const actions = e.behavior();
          actions.forEach(act => {
            if (act.type === "attack") {
              playerHP -= act.value;
              floatText(document.body, `-${act.value}`, "orange");
              log(`${e.name} atacou!`);
            } else if (act.type === "heal") {
              e.hp += act.value;
              floatText(e.el, `+${act.value}`, "lime");
              log(`${e.name} se curou!`);
            }
          });
        });
        energy = 5;
        generateDeck();  // Comprar novas cartas
        drawCards();     // Exibir novas cartas
        updateHUD();
        checkGameOver();
      }, 600);
    }

    function checkEnemies() {
      enemies = enemies.filter(e => e.hp > 0);
      drawEnemies();
      if (enemies.length === 0) log("Vitória! Avance no mapa.");
    }

    function checkGameOver() {
      if (playerHP <= 0) {
        playerHP = 0;
        updateHUD();
        log("Você morreu!");
      }
    }

    function floatText(target, text, color) {
      const span = document.createElement("span");
      span.className = "floating";
      span.style.color = color;
      span.textContent = text;
      if (target === document.body) {
        span.style.position = "fixed";
        span.style.left = "50%";
        span.style.bottom = "80px";
      }
      target.appendChild(span);
      setTimeout(() => span.remove(), 1000);
    }

    function updateHUD() {
      document.getElementById("player-hp").textContent = playerHP;
      document.getElementById("energy").textContent = energy;
    }

    function log(msg) {
      document.getElementById("log").textContent = msg;
    }

    function enterRoom() {
      generateDeck();
      spawnEnemies();
      drawEnemies();
      drawCards();
      drawMap();
      energy = 5;
      updateHUD();
      log("Entrou em uma nova sala.");
    }

    document.getElementById("end-turn").onclick = function() {
      if (energy === 0) {
        log("Você não tem energia para jogar.");
        enemyTurn();
      } else {
        log("Você pulou a vez.");
        enemyTurn();
      }
    };

    enterRoom();
  </script>
</body>
</html>
