<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhythm Fever Purple</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
user-select:none;
}

body{
height:100vh;
overflow:hidden;
background-image: url(../img/jogo/background/background.png);
}

/* ========================= */
/* BATTLEFIELD OVERLAY */
/* ========================= */
#battlefield{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
background:rgba(20,0,30,0.35);
backdrop-filter: blur(8px);
}

/* ========================= */
/* GAME */
/* ========================= */
#game{
width:85%;
max-width:1100px;
height:720px;

/* background:linear-gradient(180deg, rgba(40,0,60,0.8), rgba(10,0,20,0.9));
border:2px solid rgba(180,0,255,0.4);
box-shadow:0 0 40px rgba(160,0,255,0.25); */

position:relative;
display:flex;
justify-content: center;
overflow:hidden;

border-radius:18px;
}

/* ========================= */
/* LANES */
/* ========================= */
.lane{
flex:1;
max-width: 120px;
position:relative;
border-left:1px solid rgba(180,0,255,0.15);
border-right:1px solid rgba(180,0,255,0.15);
border-top:1px solid rgba(180,0,255,0.15);

transition:.1s;
}

.lane:hover{
background:rgba(140,0,255,0.05);
}

/* KEY */
.key{
position:absolute;
bottom:0;
width:100%;
height:18%;

background:rgba(30,0,50,0.9);
border-top:2px solid rgba(200,0,255,0.4);

display:flex;
justify-content:center;
align-items:center;

font-size:28px;
font-weight:bold;
color:#d8a7ff;

text-shadow:0 0 10px rgba(200,0,255,0.6);
}

/* HIT LINE */
.hit-line{
position:absolute;
bottom:18%;
width:100%;
height:3px;

background:linear-gradient(90deg, transparent, #b300ff, transparent);
opacity:.6;

box-shadow:0 0 10px #b300ff;
animation:pulse 1.2s infinite;
}

@keyframes pulse{
0%,100%{opacity:.4;}
50%{opacity:1;}
}

/* NOTES */
.note{
width:80%;
height:22px;
background:linear-gradient(90deg,#b300ff,#6a00ff);
position:absolute;
left:10%;
border-radius:12px;

box-shadow:
0 0 12px rgba(179,0,255,0.8),
0 0 25px rgba(120,0,255,0.4);
}

/* ========================= */
/* FEVER UI */
/* ========================= */
#ui{
position:absolute;
top:12px;
left:12px;
z-index:10;
}

#feverBar{
width:260px;
height:10px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(180,0,255,0.3);
border-radius:10px;
overflow:hidden;
}

#feverFill{
height:100%;
width:0%;
background:linear-gradient(90deg,#7a00ff,#d100ff,#ff4dff);
box-shadow:0 0 15px #b300ff;
transition:.1s;
}

/* JUDGE TEXT */
#judge{
margin-top:10px;
font-size:24px;
height:28px;
color:#fff;
text-shadow:0 0 10px rgba(180,0,255,0.7);
}

.perfect{color:#d100ff;}
.good{color:#8f00ff;}
.miss{color:#ff4d6d;}

/* FEVER MODE */
body.fever{
background:radial-gradient(circle at center, #2a003d, #050008);
}

/* KEY EFFECT */
.effect{
transform:scale(.95);
background:#fff !important;
color:#000 !important;
box-shadow:0 0 20px #fff;
}

</style>
</head>

<body>

<div id="battlefield">

<div id="game2">

<div id="ui">
<div id="feverBar">
<div id="feverFill"></div>
</div>
<div id="judge"></div>
</div>

<div class="lane" data-key="a"><div class="hit-line"></div><div class="key">A</div></div>
<div class="lane" data-key="s"><div class="hit-line"></div><div class="key">S</div></div>
<div class="lane" data-key="d"><div class="hit-line"></div><div class="key">D</div></div>
<div class="lane" data-key="f"><div class="hit-line"></div><div class="key">F</div></div>

</div>
</div>

<script>

const lanes = document.querySelectorAll(".lane");
const feverFill = document.getElementById("feverFill");
const judgeEl = document.getElementById("judge");

let notes = [];
let fever = 0;
let feverActive = false;
let feverStartTime = 0;

const FEVER_OUT = 1200;
const FEVER_HOLD = 10000;
const FEVER_IN = 1200;

const targetX = [-140,-50,50,140];

// =====================
function lerp(a,b,t){
return a+(b-a)*t;
}

// =====================
function startFever(){
feverActive = true;
feverStartTime = performance.now();
feverFill.style.width="100%";
document.body.classList.add("fever");
fever = 0;
}

// =====================
function updateFeverWave(){

if(!feverActive){
lanes.forEach(l=>{
l._x = lerp(l._x||0,0,0.12);
l.style.transform=`translateX(${l._x}px)`;
});
return;
}

const now = performance.now();
const t = now-feverStartTime;

let p=0;

if(t<FEVER_OUT)p=t/FEVER_OUT;
else if(t<FEVER_OUT+FEVER_HOLD)p=1;
else if(t<FEVER_OUT+FEVER_HOLD+FEVER_IN)
p=1-((t-FEVER_OUT-FEVER_HOLD)/FEVER_IN);
else return endFever();

for(let i=0;i<lanes.length;i++){
let l=lanes[i];
let wave=Math.sin(now*0.004+i)*5;

l._x=targetX[i]*p;

l.style.transform=`translateX(${l._x}px) translateY(${wave}px)`;
}
}

// =====================
function endFever(){
feverActive=false;
feverStartTime=0;
feverFill.style.width="0%";
document.body.classList.remove("fever");

lanes.forEach(l=>{
l._x=0;
l.style.transform="translateX(0px)";
});
}

// =====================
function checkFever(){
fever=Math.max(0,Math.min(100,fever));
feverFill.style.width=fever+"%";
if(fever>=100 && !feverActive) startFever();
}

// =====================
function spawn(){
const i=Math.floor(Math.random()*4);
const lane=lanes[i];

const note=document.createElement("div");
note.className="note";

lane.appendChild(note);

notes.push({
el:note,
key:lane.dataset.key,
y:-30
});
}

setInterval(spawn,550);

// =====================
function loop(){

updateFeverWave();

for(let i=notes.length-1;i>=0;i--){

let n=notes[i];
n.y+=feverActive?7:5;
n.el.style.top=n.y+"px";

if(n.y>620) miss(i);
}

requestAnimationFrame(loop);
}
loop();

// =====================
document.addEventListener("keydown",e=>{
hit(e.key.toLowerCase());
});

function hit(k){

const lane=[...lanes].find(l=>l.dataset.key===k);
if(!lane) return;

flash(lane);

for(let i=0;i<notes.length;i++){

let n=notes[i];
if(n.key!==k) continue;

let d=Math.abs(n.y-585);

if(d<25)return perfect(i);
if(d<60)return good(i);
}
}

// =====================
function perfect(i){
remove(i);
show("PERFECT","perfect");
fever+=6;
checkFever();
}

function good(i){
remove(i);
show("GOOD","good");
fever+=3;
checkFever();
}

function miss(i){
if(notes[i]){
notes[i].el.remove();
notes.splice(i,1);
}
fever-=10;
show("MISS","miss");
}

// =====================
function remove(i){
if(notes[i]){
notes[i].el.remove();
notes.splice(i,1);
}
}

// =====================
function show(t,c){
judgeEl.textContent=t;
judgeEl.className=c;
setTimeout(()=>judgeEl.textContent="",350);
}

function flash(l){
let k=l.querySelector(".key");
k.classList.add("effect");
setTimeout(()=>k.classList.remove("effect"),80);
}

</script>
</body>
</html>
